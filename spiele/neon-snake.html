<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon-Snake</title><style>html,body{margin:0;height:100%;background:#0d0c1d;color:#f3f0ff;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}#w{display:flex;flex-direction:column;align-items:center;gap:12px}#hud{display:flex;gap:24px;font-weight:700;font-size:18px}#hud span{color:#ffb547}canvas{background:#15132b;border:2px solid #2f2c52;border-radius:12px;max-width:92vmin;max-height:78vmin;width:92vmin;height:92vmin;image-rendering:pixelated}#msg{position:absolute;text-align:center;pointer-events:none;font-size:22px;font-weight:800;text-shadow:0 2px 10px #000}#msg small{display:block;font-size:14px;font-weight:500;opacity:.8;margin-top:6px}</style></head><body><div id="w"><div id="hud">Punkte: <span id="s">0</span> Rekord: <span id="h">0</span></div><canvas id="c" width="400" height="400"></canvas></div><div id="msg">NEON-SNAKE<small>Pfeiltasten / WASD oder wischen · Leertaste zum Starten</small></div><script>const c=document.getElementById('c'),x=c.getContext('2d'),N=20,G=400/N;let sn,d,nd,f,sc,run=false,over=false,t=0,sp=120;let hi=0;try{hi=+(localStorage.getItem('snakehi')||0)}catch(e){}document.getElementById('h').textContent=hi;function reset(){sn=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];d={x:1,y:0};nd=d;sc=0;sp=120;place();upd()}function place(){do{f={x:Math.random()*N|0,y:Math.random()*N|0}}while(sn.some(p=>p.x==f.x&&p.y==f.y))}function upd(){document.getElementById('s').textContent=sc}function msg(a,b){const m=document.getElementById('msg');m.innerHTML=a?a+'<small>'+b+'</small>':''}function start(){reset();run=true;over=false;msg('')}function step(){d=nd;const h={x:(sn[0].x+d.x+N)%N,y:(sn[0].y+d.y+N)%N};if(sn.some(p=>p.x==h.x&&p.y==h.y)){run=false;over=true;if(sc>hi){hi=sc;try{localStorage.setItem('snakehi',hi)}catch(e){}document.getElementById('h').textContent=hi}msg('GAME OVER','Punkte: '+sc+' · Leertaste oder tippen für neue Runde');return}sn.unshift(h);if(h.x==f.x&&h.y==f.y){sc++;upd();sp=Math.max(55,sp-3);place()}else sn.pop()}function draw(){x.fillStyle='#15132b';x.fillRect(0,0,400,400);x.fillStyle='rgba(255,255,255,.04)';for(let i=0;i<N;i++)for(let j=0;j<N;j++)if((i+j)%2)x.fillRect(i*G,j*G,G,G);x.shadowBlur=16;x.shadowColor='#ff6b81';x.fillStyle='#ff6b81';x.beginPath();x.arc(f.x*G+G/2,f.y*G+G/2,G/2.6,0,7);x.fill();x.shadowColor='#ffb547';sn.forEach((p,i)=>{x.fillStyle=i?'hsl('+(40-i*1.5)+',100%,'+(64-i*.6)+'%)':'#fff0c2';x.fillRect(p.x*G+2,p.y*G+2,G-4,G-4)});x.shadowBlur=0}function loop(ts){if(run&&ts-t>sp){t=ts;step()}draw();requestAnimationFrame(loop)}const dirs={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};function turn(a){if(a[0]==-d.x&&a[1]==-d.y)return;nd={x:a[0],y:a[1]}}addEventListener('keydown',e=>{const k=e.key.length==1?e.key.toLowerCase():e.key;if(k==' '){e.preventDefault();if(!run)start();return}if(dirs[k]){e.preventDefault();if(!run)start();turn(dirs[k])}});let sx,sy;addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;if(!run)start()});addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;turn(Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)])});reset();requestAnimationFrame(loop);</script></body></html>
